<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slash32 Midterm Results Live</title>

<style>
/* TV layout, fixed 1920x1080 stage scaled to the window.
   Row 1: brand bar. Row 2: big Senate / House / Governors scoreboard. Row 3: one featured race (rotates) + map + latest calls. Row 4: calls ticker.
   Brand: Slash32 teal + peach; party colours stay conventional blue / red. */
:root{
  --bg:#0a1416; --panel:#111e21; --panel2:#16272b; --ink:#f3f6f6; --muted:#9db0b3; --line:#22373b;
  --teal:#14a395; --teal-deep:#0f766e; --peach:#f6b48f;
  --dem:#3b82f6; --dem-soft:#1c3561; --rep:#ef4444; --rep-soft:#5a1f24; --ind:#a78bfa; --ind-soft:#3a2d5c;
  --none:#1c2c30; --wait:#2b3f44; --live:#ff3b52; --gold:#ffd166;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(1200px 600px at 20% 0%,#0f2427 0%,var(--bg) 60%);color:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums;display:grid;grid-template-rows:104px 232px 1fr 76px;gap:0}

/* Brand bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:0 48px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.logo svg{width:58px;height:58px}
.logo .word{font-size:40px;font-weight:600;letter-spacing:-.02em}
.logo .word b{font-weight:800;color:var(--peach)}
.sep{width:2px;height:48px;background:var(--line)}
.title{font-size:34px;font-weight:800;letter-spacing:-.01em}
.title small{display:block;font-size:18px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.right{display:flex;align-items:center;gap:26px}
.live{display:inline-flex;align-items:center;gap:10px;background:var(--live);color:#fff;font-weight:800;font-size:22px;letter-spacing:.12em;padding:8px 18px;border-radius:8px}
.live i{width:12px;height:12px;border-radius:50%;background:#fff;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
.clock{text-align:right}
.clock b{display:block;font-size:42px;font-weight:800;line-height:1}
.clock span{color:var(--muted);font-size:19px;font-weight:600}

/* Scoreboard */
.board{display:grid;grid-template-columns:1fr 1fr 640px;gap:24px;padding:22px 48px 0}
.score{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 26px 20px;display:flex;flex-direction:column;justify-content:space-between}
.score .h{display:flex;justify-content:space-between;align-items:baseline}
.score .h b{font-size:30px;font-weight:800}
.score .h span{font-size:20px;color:var(--muted);font-weight:600}
.score .n{display:flex;justify-content:space-between;align-items:flex-end}
.score .n .d,.score .n .r{font-size:84px;font-weight:900;line-height:.9;letter-spacing:-.03em}
.score .n .d{color:var(--dem)} .score .n .r{color:var(--rep);text-align:right}
.score .n .d small,.score .n .r small{display:block;font-size:17px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-top:8px}
.score .n .m{text-align:center;font-size:19px;color:var(--muted);font-weight:600;padding-bottom:6px}
.score .n .m b{display:block;font-size:30px;color:var(--ink);font-weight:800}
.bar{position:relative;display:flex;height:22px;border-radius:11px;overflow:hidden;background:var(--none);margin-top:12px}
.bar div{height:100%;transition:width 1s ease}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:4px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--panel)}
.score.small .n .d,.score.small .n .r{font-size:64px}

/* Main row */
.main{display:grid;grid-template-columns:1160px 1fr;gap:24px;padding:22px 48px;min-height:0}
.feature{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 44px 26px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.feature .office{display:flex;align-items:center;gap:14px;font-size:24px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.feature .office .key{color:var(--peach)}
.feature h2{font-size:104px;font-weight:900;line-height:1;margin:6px 0 16px;letter-spacing:-.03em}
.status{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;padding:9px 18px;border-radius:10px;border:2px solid var(--muted);color:var(--muted)}
.chip.D{background:var(--dem);border-color:var(--dem);color:#fff}.chip.R{background:var(--rep);border-color:var(--rep);color:#fff}.chip.I{background:var(--ind);border-color:var(--ind);color:#fff}
.chip.count{border-color:var(--gold);color:var(--gold)}
.chip.flip{background:var(--gold);border-color:var(--gold);color:#111}
.reporting{font-size:24px;color:var(--muted);font-weight:600}
.reporting b{color:var(--ink)}
.h2h{margin-top:auto;display:grid;gap:22px}
.cand{display:grid;grid-template-columns:96px 1fr auto;gap:24px;align-items:center}
.av{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#fff;position:relative}
.av.win::after{content:"✓";position:absolute;right:-6px;bottom:-6px;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#111;font-size:24px;display:flex;align-items:center;justify-content:center;border:4px solid var(--panel)}
.cand .nm{font-size:54px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.cand .nm small{display:block;font-size:22px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:4px}
.cand .pc{font-size:80px;font-weight:900;letter-spacing:-.03em}
.cand.lose{opacity:.55}
.split{display:flex;height:26px;border-radius:13px;overflow:hidden;background:var(--none);margin-top:4px}
.split div{height:100%;transition:width 1s ease}
.ffoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;color:var(--muted);font-size:21px;font-weight:600}
.timer{position:absolute;left:0;bottom:0;height:6px;background:var(--teal);width:0}
.fade{animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.side{display:grid;grid-template-rows:auto 1fr;gap:24px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 26px}
.panel .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.panel .h b{font-size:26px;font-weight:800}
.panel .h span{color:var(--muted);font-size:18px;font-weight:600}
.map{display:grid;grid-template-columns:repeat(12,40px);grid-auto-rows:34px;gap:5px;justify-content:center}
.tile{border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:var(--none);color:#4d6266}
.tile.wait{background:var(--wait);color:var(--ink)}
.tile.lead-D{background:var(--dem-soft);color:#cfe0ff}.tile.lead-R{background:var(--rep-soft);color:#ffd5d8}.tile.lead-I{background:var(--ind-soft);color:#eadcff}
.tile.win-D{background:var(--dem);color:#fff}.tile.win-R{background:var(--rep);color:#fff}.tile.win-I{background:var(--ind);color:#fff}
.tile.feat{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;justify-content:center;gap:18px;margin-top:12px;font-size:16px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.calls{display:grid;gap:10px;align-content:start;min-height:0;overflow:hidden}
.call{display:grid;grid-template-columns:8px 1fr auto;gap:14px;align-items:center;background:var(--panel2);border-radius:12px;padding:12px 16px}
.call .bar8{width:8px;height:40px;border-radius:4px}
.call b{font-size:23px;font-weight:800;display:block}
.call span{font-size:17px;color:var(--muted);font-weight:600}
.call .tag{font-size:16px;font-weight:800;letter-spacing:.06em;padding:4px 10px;border-radius:6px;background:var(--gold);color:#111}
.empty{color:var(--muted);font-size:20px;padding:8px 2px}
.ctlchip{font-weight:800;font-size:17px;letter-spacing:.05em;padding:4px 10px;border-radius:6px;color:#fff !important}.ctlchip.D{background:var(--dem)}.ctlchip.R{background:var(--rep)}

/* Ticker */
.ticker{display:flex;align-items:center;background:var(--panel2);border-top:1px solid var(--line);overflow:hidden}
.ticker .lab{flex:none;height:100%;display:flex;align-items:center;padding:0 28px;background:var(--teal-deep);color:#fff;font-weight:900;font-size:22px;letter-spacing:.08em}
.ticker .track{flex:1;overflow:hidden;white-space:nowrap;position:relative;height:100%}
.ticker .run{position:absolute;top:0;height:100%;display:flex;align-items:center;gap:64px;font-size:27px;font-weight:600;white-space:nowrap;animation:scroll linear infinite}
.ticker .run b{font-weight:800}
.ticker .run .D{color:#93b8ff}.ticker .run .R{color:#ff9ca3}.ticker .run .I{color:#cdb8ff}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.disc{flex:none;padding:0 28px;color:var(--muted);font-size:17px;text-align:right;line-height:1.3;font-weight:600}
.disc b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ticker .run{animation:none}.live i{animation:none}.fade{animation:none}}
</style>
</head>

{"id": "gov-WI", "o": "gov", "st": "WI", "inc": "D", "key": 1, "c": [["David Crowley", "D", null, 0], ["Tom Tiffany", "R", null, 0]], "rep": null, "s": "wait"},
{"id": "gov-WY", "o": "gov", "st": "WY", "inc": "R", "c": [["Kenneth Casner", "D", null, 0], ["Eric Barlow", "R", null, 0]], "rep": null, "s": "wait"}

<script>
(function(){
const NAMES={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming"};
const GRID=[["AK",0,0],["ME",11,0],["WI",6,1],["VT",10,1],["NH",11,1],["WA",1,2],["ID",2,2],["MT",3,2],["ND",4,2],["MN",5,2],["IL",6,2],["MI",7,2],["NY",9,2],["MA",10,2],["OR",1,3],["NV",2,3],["WY",3,3],["SD",4,3],["IA",5,3],["IN",6,3],["OH",7,3],["PA",8,3],["NJ",9,3],["CT",10,3],["RI",11,3],["CA",1,4],["UT",2,4],["CO",3,4],["NE",4,4],["MO",5,4],["KY",6,4],["WV",7,4],["VA",8,4],["MD",9,4],["DE",10,4],["AZ",2,5],["NM",3,5],["KS",4,5],["AR",5,5],["TN",6,5],["NC",7,5],["SC",8,5],["OK",4,6],["LA",5,6],["MS",6,6],["AL",7,6],["GA",8,6],["HI",0,7],["TX",4,7],["FL",9,7]];
const PN={D:"Democrat",R:"Republican",I:"Independent"};
const COL={D:"var(--dem)",R:"var(--rep)",I:"var(--ind)"};
const ROTATE=10000;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data=DATA, idx=0, mapOffice="sen", lastTicker="", timerStart=0;

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$("stage");st.style.transform="scale("+s+")";st.style.left=((innerWidth-1920*s)/2)+"px";st.style.top=((innerHeight-1080*s)/2)+"px";}
addEventListener("resize",fit); fit();

function leader(r){ if(r.s==="call") return r.w; const p=r.c.filter(c=>c[2]!=null); return p.length?p.slice().sort((a,b)=>b[2]-a[2])[0][1]:null; }
const flip=r=>r.s==="call"&&r.w&&r.inc&&r.w!==r.inc;
const initials=n=>n.split(/\s+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).slice(0,2).join("");
const last=n=>n.split(" ").slice(-1)[0];
function tally(o){const t={D:0,R:0,I:0,ldD:0,ldR:0,ldI:0,un:0};data.races.filter(r=>r.o===o).forEach(r=>{if(r.s==="call"&&r.w)t[r.w]++;else{const l=leader(r);if(l)t["ld"+l]++;else t.un++;}});return t;}
function bar(segs,total,mark){return '<div class="bar">'+segs.filter(s=>s[1]>0).map(s=>'<div style="width:'+(s[1]/total*100)+'%;background:'+s[0]+'"></div>').join("")+'<div class="mark" style="left:calc('+(mark/total*100)+'% - 2px)"></div></div>';}
function score(cls,title,sub,d,r,midB,midS,segs,total,mark){
  return '<div class="score '+cls+'"><div class="h"><b>'+title+'</b><span>'+sub+'</span></div><div class="n"><div class="d">'+d+'<small>DEM</small></div><div class="m"><b>'+midB+'</b>'+midS+'</div><div class="r">'+r+'<small>REP</small></div></div>'+bar(segs,total,mark)+'</div>';
}
function ctl(k){const c=(data.meta.control||{})[k];return c?'<span class="ctlchip '+c.w+'">'+(c.w==="D"?"DEMOCRATS":"REPUBLICANS")+" WIN CONTROL · "+esc(c.by)+"</span>":null;}
function renderBoard(){
  const m=data.meta,s=tally("sen"),g=tally("gov"),h=m.house;
  const sD=m.senNotUp.D+s.D,sR=m.senNotUp.R+s.R,gD=m.govNotUp.D+g.D,gR=m.govNotUp.R+g.R,hu=435-h.D-h.R-h.I;
  $("board").innerHTML=
    score("","Senate",ctl("senate")||"51 for control",sD,sR,(35-s.D-s.R-s.I),"races to call",[["var(--dem)",sD],["var(--dem-soft)",s.ldD],["var(--ind)",s.I+s.ldI],["var(--none)",s.un],["var(--rep-soft)",s.ldR],["var(--rep)",sR]],100,50)+
    score("","House",ctl("house")||"218 for majority",h.D,h.R,hu,"seats to call",[["var(--dem)",h.D],["var(--ind)",h.I],["var(--none)",hu],["var(--rep)",h.R]],435,218)+
    score("small","Governors","36 races",gD,gR,(36-g.D-g.R-g.I),"to call",[["var(--dem)",gD],["var(--dem-soft)",g.ldD],["var(--ind)",g.I],["var(--none)",g.un],["var(--rep-soft)",g.ldR],["var(--rep)",gR]],50,25);
}
// Rotation: new calls and counting key races first, then other counting races, then key races still waiting.
function rotation(){
  const rs=data.races;
  const called=rs.filter(r=>r.s==="call");
  const countKey=rs.filter(r=>r.s==="count"&&r.key), count=rs.filter(r=>r.s==="count"&&!r.key);
  const waitKey=rs.filter(r=>r.s==="wait"&&r.key);
  const list=[...countKey,...called.filter(r=>r.key||flip(r)),...count,...called.filter(r=>!(r.key||flip(r))),...waitKey];
  return list.length?list:rs.slice(0,8);
}
function renderFeature(){
  const list=rotation(); if(idx>=list.length) idx=0;
  const r=list[idx]; mapOffice=r.o;
  let chip;
  if(r.s==="call") chip='<span class="chip '+r.w+'">✓ '+esc(last((r.c.find(c=>c[1]===r.w)||[PN[r.w]])[0]))+' wins</span>'+(flip(r)?'<span class="chip flip">Seat flips '+r.inc+' → '+r.w+'</span>':'');
  else if(r.s==="count") chip='<span class="chip count">Too early to call</span>';
  else chip='<span class="chip">Waiting for results</span>';
  const rep=r.rep!=null?'<span class="reporting"><b>'+r.rep+'%</b> of votes counted</span>':(r.s==="count"?'<span class="reporting">Early returns</span>':'');
  const cands=r.c.slice().sort((a,b)=>(b[2]||0)-(a[2]||0));
  const lead=leader(r);
  const rows=cands.map(c=>{
    const won=r.s==="call"&&r.w===c[1], lose=r.s==="call"&&r.w!==c[1];
    return '<div class="cand'+(lose?' lose':'')+'"><div class="av'+(won?' win':'')+'" style="background:'+COL[c[1]]+'">'+esc(initials(c[0]))+'</div><div class="nm">'+esc(c[0])+'<small>'+PN[c[1]]+(c[3]?' · incumbent':'')+'</small></div><div class="pc">'+(c[2]!=null?c[2].toFixed(1)+'%':'—')+'</div></div>';
  }).join("");
  const d=cands.find(c=>c[1]==="D")||cands[0], o=cands.find(c=>c!==d)||cands[1];
  const split='<div class="split"><div style="width:'+(d[2]||0)+'%;background:'+COL[d[1]]+'"></div><div style="flex:1"></div><div style="width:'+(o[2]||0)+'%;background:'+COL[o[1]]+'"></div></div>';
  $("feature").innerHTML='<div class="fade" style="display:flex;flex-direction:column;height:100%"><div class="office">'+(r.o==="sen"?"U.S. Senate":"Governor")+(r.sp?" · special election":"")+(r.key?' <span class="key">· race to watch</span>':'')+'</div>'+
    '<h2>'+NAMES[r.st]+'</h2><div class="status">'+chip+rep+'</div>'+
    '<div class="h2h">'+rows+split+'</div>'+
    '<div class="ffoot"><span>Seat held by '+PN[r.inc]+'s'+(r.s==="call"&&r.by?' · projected by '+esc(r.by):'')+'</span><span>Race '+(idx+1)+' of '+list.length+'</span></div></div><div class="timer" id="timer"></div>';
  timerStart=performance.now();
  renderMap(r);
}
function renderMap(feat){
  $("mapTitle").textContent=(mapOffice==="sen"?"Senate":"Governor")+" map";
  $("map").innerHTML=GRID.map(([st,c,rw])=>{
    const r=data.races.find(x=>x.o===mapOffice&&x.st===st);
    let cl="tile";
    if(r){ if(r.s==="call"&&r.w) cl+=" win-"+r.w; else { const l=leader(r); cl+=l?" lead-"+l:" wait"; } }
    if(feat&&feat.st===st&&feat.o===mapOffice) cl+=" feat";
    return '<div class="'+cl+'" style="grid-column:'+(c+1)+';grid-row:'+(rw+1)+'">'+st+'</div>';
  }).join("");
}
function renderCalls(){
  const called=data.races.filter(r=>r.s==="call").sort((a,b)=>(flip(b)-flip(a))||((b.key||0)-(a.key||0)));
  $("callCount").textContent=called.length+" of "+data.races.length;
  $("calls").innerHTML=called.length?called.slice(0,6).map(r=>{const w=r.c.find(c=>c[1]===r.w);return '<div class="call"><span class="bar8" style="background:'+COL[r.w]+'"></span><div><b>'+esc(w?w[0]:PN[r.w])+'</b><span>'+NAMES[r.st]+' '+(r.o==="sen"?"Senate":"Governor")+'</span></div>'+(flip(r)?'<span class="tag">FLIP</span>':'')+'</div>';}).join(""):'<div class="empty">No races called yet.</div>';
}
function renderTicker(){
  const called=data.races.filter(r=>r.s==="call").map(r=>{const w=r.c.find(c=>c[1]===r.w);return '<span><b>'+r.st+' '+(r.o==="sen"?"SENATE":"GOV")+'</b> · <span class="'+r.w+'">'+esc(w?w[0]:PN[r.w])+' ('+r.w+')</span> '+(flip(r)?'flips the seat':'wins')+'</span>';});
  const leads=data.races.filter(r=>r.s==="count").map(r=>{const l=r.c.slice().sort((a,b)=>(b[2]||0)-(a[2]||0))[0];return '<span><b>'+r.st+' '+(r.o==="sen"?"SENATE":"GOV")+'</b> · <span class="'+l[1]+'">'+esc(l[0])+'</span> leads'+(l[2]!=null?' '+l[2].toFixed(1)+'%':'')+(r.rep!=null?', '+r.rep+'% in':'')+'</span>';});
  const ctlItems=Object.entries(data.meta.control||{}).map(([k,c])=>'<span><b>'+k.toUpperCase()+'</b> · <span class="'+c.w+'">'+(c.w==="D"?"Democrats":"Republicans")+' win control</span> ('+esc(c.by)+' projects)</span>');
  const items=ctlItems.concat(called,leads); if(!items.length) items.push('<span>Polls are closing across the country · results will appear here as they come in</span>');
  const html=items.join("");
  if(html===lastTicker) return; lastTicker=html;
  const run=$("run"); run.innerHTML=html+html;
  requestAnimationFrame(()=>{run.style.animationDuration=Math.max(30,run.scrollWidth/2/70)+"s";});
}
function renderClock(){
  const now=new Date();
  $("clock").textContent=now.toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"})+" ET";
  const t=new Date(data.meta.updated),mins=Math.max(0,Math.round((now-t)/60000));
  $("updated").textContent="Results as of "+t.toLocaleTimeString("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit"})+" ET"+(mins>1?" · "+mins+" min ago":"");
}
function tickTimer(){const el=$("timer"); if(el){el.style.width=Math.min(100,(performance.now()-timerStart)/ROTATE*100)+"%";} requestAnimationFrame(tickTimer);}
function renderAll(){renderBoard();renderFeature();renderCalls();renderTicker();renderClock();}
async function poll(){
  try{const res=await fetch("data.json?t="+Date.now(),{cache:"no-store"}); if(!res.ok) return; const d=await res.json(); if(d&&d.races&&(!data||d.meta.updated!==data.meta.updated)){data=d; renderBoard();renderCalls();renderTicker();renderClock();}}catch(e){}
}
async function start(){
  if(location.protocol.startsWith("http")) await poll();
  if(!data){ $("feature").innerHTML='<h2 style="font-size:56px">Loading results…</h2>'; setTimeout(start,5000); return; }
  renderAll(); tickTimer();
  setInterval(()=>{idx++;renderFeature();},ROTATE);
  setInterval(renderClock,15000);
  if(location.protocol.startsWith("http")) setInterval(poll,60000);
}
start();
})();
</script>
